<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTI RÁDIO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #080808; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            gap: 25px; 
        }
        .panel { 
            background: #111; 
            padding: 30px; 
            border-radius: 24px;
            text-align: center; 
            width: 100%; 
            max-width: 480px; 
            border: 3px solid #ff9900; 
        }
        h2 { 
            color: #ff9900; 
            margin-top: 0; 
            font-size: clamp(1.3rem, 3vw, 1.8rem); 
        }
        .btn-group { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            max-height: 65vh; 
            overflow-y: auto; 
            padding: 5px; 
        }
        .station-btn { 
            background-color: #000; 
            padding: 16px 14px;
            cursor: pointer; 
            border-radius: 16px;
            border: 2px solid #555; 
            color: #fff; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            text-transform: uppercase; 
            font-weight: bold; 
            font-size: clamp(1rem, 2.5vw, 1.15rem); 
            width: 100%; 
            text-align: left;
        }
        .station-btn img { 
            width: 44px; 
            height: 44px; 
            border-radius: 12px;
            object-fit: cover; 
        }
        .station-btn:hover, .station-btn.active { 
            border-color: #ff9900; 
            background: #222; 
            box-shadow: 0 0 14px #ff9900; 
        }
        audio { 
            width: 100%; 
            max-width: 480px; 
            margin-top: 5px; 
            border-radius: 12px; 
        }
        #status-display { 
            color: #aaa; 
            font-size: clamp(0.9rem, 2vw, 1rem); 
            background: #000; 
            padding: 14px; 
            border-radius: 16px; 
            border: 2px solid #333; 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
        }
        @media (max-width: 600px) {
            body { padding: 12px; gap: 18px; }
            .panel { padding: 20px; }
            .station-btn { padding: 14px 12px; }
            .station-btn img { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>[ TODAS AS ESTAÇÕES ]</h2>
        <div id="btn-group" class="btn-group"></div>
    </div>

    <audio id="audio" controls>
    <div id="status-display">STATUS: CARREGANDO RÁDIOS...</div>

    <script>
        const group = document.getElementById('btn-group');
        const audio = document.getElementById('audio');
        const statusDisplay = document.getElementById('status-display');
        let hls;

        fetch('radios.json')
            .then(response => response.json())
            .then(radios => {
                statusDisplay.innerText = "✅ Status: PRONTO — Escolha uma rádio";
                radios.forEach(radio => {
                    const btn = document.createElement('button');
                    btn.className = 'station-btn';
                    btn.innerHTML = `<img src="${radio.logo}" loading="lazy" alt=""> ${radio.nome}`;
                    btn.onclick = () => {
                        document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        statusDisplay.innerText = `⏳ CONECTANDO: ${radio.nome}`;
                        
                        if (hls) { hls.destroy(); hls = null; }
                        audio.pause();
                        audio.src = "";

                        if (radio.url.includes('.m3u8')) {
                            if (Hls.isSupported()) {
                                hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60 });
                                hls.loadSource(radio.url);
                                hls.attachMedia(audio);
                                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                                    audio.play().then(() => {
                                        statusDisplay.innerText = `🎵 TOCANDO: ${radio.nome}`;
                                    }).catch(e => {
                                        statusDisplay.innerText = `⚠️ CLIQUE NOVAMENTE: ${radio.nome}`;
                                    });
                                });
                                hls.on(Hls.Events.ERROR, (e, data) => {
                                    if (data.fatal) statusDisplay.innerText = `❌ ERRO: ${radio.nome}`;
                                });
                            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                                audio.src = radio.url;
                                audio.play().then(() => {
                                    statusDisplay.innerText = `🎵 TOCANDO: ${radio.nome}`;
                                }).catch(() => {
                                    statusDisplay.innerText = `⚠️ CLIQUE DE NOVO: ${radio.nome}`;
                                });
                            } else {
                                statusDisplay.innerText = `❌ FORMATO NÃO SUPORTADO`;
                            }
                        } else {
                            audio.src = radio.url;
                            audio.play().then(() => {
                                statusDisplay.innerText = `🎵 TOCANDO: ${radio.nome}`;
                            }).catch(() => {
                                statusDisplay.innerText = `⚠️ CLIQUE DE NOVO: ${radio.nome}`;
                            });
                        }
                    };
                    group.appendChild(btn);
                });
            })
            .catch(err => {
                console.error("Erro ao carregar JSON:", err);
                statusDisplay.innerText = "❌ ERRO AO CARREGAR RÁDIOS! Verifique o arquivo radios.json";
            });
    </script>
</body>
</html>
